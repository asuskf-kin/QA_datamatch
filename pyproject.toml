[project]
name = "datamatch-qa"
version = "0.1.0"
description = "QA del datamatch Dataplor vs POS: threshold, super_match, rescate por nombre+distancia y exportes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",       # requerido por pandas Styler (reporte HTML)
    "matplotlib>=3.8",   # gráficos + background_gradient
    "scipy>=1.11",       # KDE y detección de valles
]

[project.scripts]
datamatch-qa = "datamatch_qa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamatch_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
